[project]
name = "fishsense-lite"
version = "0.0.0"
description = "FishSense Lite system monorepo (workspace root — see services/ for the actual deliverables)."
requires-python = ">=3.13"

[tool.uv]
package = false
# Force fishsense-api-sdk to resolve to the workspace member even when external
# transitive deps (fishsense-core) declare their own git source for it. Without
# this, uv refuses to resolve the conflict between path:// and git+https://.
override-dependencies = [
    "fishsense-api-sdk",
    # SAM3 declares `numpy>=1.26,<2`, which is stale rather than real: the
    # upstream checkout has been exercised end to end on numpy 2.4.6, and every
    # measurement behind the head/tail stage's backend choice was taken there.
    # fishsense-core requires numpy>=2.3.5, so without this the data-worker
    # cannot resolve at all. Revisit if SAM3 ever publishes a wheel with an
    # honest pin.
    "numpy",
]

# Workspace-level dev group. uv's --all-groups only picks up groups defined on
# the package being synced (workspace root by default), so cross-package test
# plugins live here to guarantee they're installed by `uv sync --all-groups`.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.15.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.workspace]
members = [
    "services/fishsense-api",
    "services/fishsense-api-workflow-worker",
    "services/fishsense-backup-worker",
    "services/fishsense-data-processing-workflow-worker",
    "libs/*",
]

[tool.uv.sources]
fishsense-api-sdk = { workspace = true }
fishsense-shared = { workspace = true }
# UCSD-E4E's Rust-implemented FileStation client (PyO3 wheel published as
# a GitHub release asset — not on PyPI). Replaces the synology-api PyPI
# package starting with the api-workflow-worker; the backup-worker
# follow-up swaps in shortly after. The Rust client raises typed
# exceptions on DSM JSON-error responses (esp. SidNotFound for code 119)
# and writes downloads atomically (`<local>.part` + rename), eliminating
# the silent JSON-corruption failure mode that wedged stage 2 on
# 2026-05-07. Wheel is cp310-abi3 + manylinux_2_34, compatible with
# python:3.13-slim-trixie via the stable ABI. Bump the URL when picking
# up a new release; v0.1.18 raised the project's requires-python to
# >=3.10, so the platform tag flipped from cp39-abi3 to cp310-abi3.
#
# v0.2.0 (2026-07-29): auto-prefers SMB with transparent HTTP fallback and
# throttles bulk transfers to protect the NAS — fixes the FileStation
# download-API HTTP 502s that were failing raw `.ORF` staging (stage 0.1/1/2/
# 5.1/9 preprocess parents) under load. No API change; drop-in URL bump.
synology-filestation = { url = "https://github.com/UCSD-E4E/synology-filestation/releases/download/synology_filestation-v0.2.0/synology_filestation-0.2.0-cp310-abi3-manylinux_2_34_x86_64.whl" }

# Workspace-wide pylint configuration. Lives at the repo root so every
# package picks up the same rules; pylint walks up the directory tree
# from the target file looking for the closest `pyproject.toml` with a
# `[tool.pylint.*]` section.
[tool.pylint.main]
extension-pkg-allow-list = ["cv2"]
# `deploy/` is deployment config + vendored third-party (e.g. Apache Superset's
# stock `superset_config.py`, which isn't pylint-clean by our standards), not
# first-party package code — exclude it. The changed-files pylint job passes
# file paths explicitly, and pylint honors `ignore-paths` for those too.
ignore-paths = ["^deploy/.*$"]

[tool.pylint."messages control"]
# fail-under=10 with all checks on is unworkable for a real codebase;
# disable the high-noise checks and require the rest to be clean.
disable = [
    # Tests document themselves by name; no need to require docstrings
    # on `def test_<thing_being_asserted>`.
    "missing-function-docstring",
    "missing-module-docstring",
    "missing-class-docstring",
    # Standard pytest fixture pattern shadows the fixture function name
    # in the test parameter list. Pylint flags every fixture use.
    "redefined-outer-name",
    # Pydantic BaseModel + workflow input DTOs are data-only by design;
    # this warning treats every one of them as a code smell.
    "too-few-public-methods",
    # Function-local imports are a deliberate, repo-wide pattern here, not an
    # oversight, and three separate mechanisms depend on them:
    #
    #   * Dynaconf validates EVERY validator on first attribute access of
    #     `settings`, so a module-level import of anything that touches config
    #     forces every unrelated setting to be present. Tests and activities
    #     import inside the function to control when that happens.
    #   * `fishsense_api.controllers` registers routes as an import side
    #     effect; the API's tests import controllers inside the test body so
    #     registration order stays under the test's control rather than
    #     pytest's collection order.
    #   * The api tests import SQLModel classes inside fixtures so the module
    #     imports cleanly on a default `-m "not integration"` run, before any
    #     database settings exist.
    #
    # This was previously spelled as 694 inline pragmas across 71 files, which
    # is exactly what CLAUDE.md says not to do ("put any lint exemption in the
    # root pyproject.toml where it is reviewable in one place. Never inline").
    # They also made `black` unusable: reflowing a long import moved the
    # trailing pragma onto the closing paren, where pylint no longer applied
    # it, turning 3 findings into ~30 in a single file.
    "import-outside-toplevel",
]

# `duplicate-code` (R0801) is ENABLED on purpose — see CLAUDE.md's
# "Never suppress duplicate-code / R0801". It was blanket-disabled here
# for years, which made the 14 inline `# pylint: disable=duplicate-code`
# pragmas scattered through the SDK/API models and sync workflows
# no-ops, and let copy-pasted workflow parents drift until their
# comments documented behavior their own code contradicted.
#
# The knobs below are what make it usable rather than noisy:
#   * ignore-* strip the parts that are duplicated by design — imports,
#     signatures, docstrings, comments — so a hit means duplicated
#     *logic*, not duplicated boilerplate.
#   * min-similarity-lines=12 is calibrated, not guessed: across the six
#     package source roots it yields 6 findings, all genuine (the
#     two-copy `object_store.py` key contract at ~92 lines, and five
#     preprocess/predict parent-workflow clones at 20-31 lines). Dropping
#     to 8 adds 15 more, mostly per-service `config.py`/`nas.py` pairs
#     that are legitimately separate. Re-measure before changing it:
#     pylint --disable=all --enable=duplicate-code --output-format=json
#     <the six src/<pkg> roots>
#
# Note this only compares files within a single pylint invocation, and
# `check.sh lint` passes only files changed since origin/main — so it
# fires when both copies of a clone move in one PR, not on every run.
[tool.pylint.similarities]
min-similarity-lines = 12
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
[tool.pylint.basic]
# Linear-algebra / pinhole-camera variable names + a few helper names
# that read worse in snake_case (camera matrix `_make_K`, OpenCV's
# camelCase parameter mirroring in notebook-parity tests).
good-names = [
    "i", "j", "k", "n", "x", "y", "z",
    "K", "D", "P", "_K", "_D", "_P",
    "P_laser", "P_head", "P_tail",
    "_make_K",
    "fontFace", "fontScale", "lineType",
]

[tool.pylint.design]
# Activity entrypoints take 6+ kwargs (db_name, host, port, user, password,
# output_path); 8 lets these stay flat instead of forcing a dataclass per
# call site. Locals bumped because notebook-parity tests recreate the
# notebook line-for-line and need to track many intermediate arrays.
max-args = 8
max-positional-arguments = 8
max-locals = 20

[tool.black]
target-version = ["py313"]
# Scoped to the packages' `src/` trees, which is what ships in the images.
# `check.sh lint` runs `black --check` over exactly this set, so the config and
# the gate cannot disagree about what is formatted.
#
# NOT applied to `tests/`, and after actually attempting it that looks like the
# right long-term answer rather than a temporary gap. The reason is measured. Formatting the whole tree reformats 261 files and produces 48
# pylint findings, 14 of them `duplicate-code` pairs across five clusters of
# near-identical test suites (the two big api predicate suites, the four
# `resolve_*_preprocess_inputs` suites, the sync-label workflow tests, and two
# parent-workflow tests). Those clones are pre-existing — invisible until a
# change makes those files move together — and extracting them is a piece of
# work in its own right, comparable to the extraction that came with
# centralising the `import-outside-toplevel` pragmas. `src/` alone is 133 files
# and 9 findings, all fixed here.
#
# The extraction was attempted (2026-08-25). Five of the fourteen pairs came
# out cleanly — the resolver suites' shared builders, now in
# `worker_tests_support/preprocess.py`. The other nine did not, and the reason
# is that they are not helper-shaped:
#
#   * Four pairs are seed literals inside test bodies —
#     `LaserLabel(...)`/`SpeciesLabel(...)` constructions repeated across
#     `test_dive_pipeline_status_view` and `test_select_next_dive_endpoints`,
#     133 of them across 3850 lines. Those two suites are what pin the
#     cohort-selector/`dive_pipeline_status` agreement that CLAUDE.md requires,
#     and rewriting their seed data to break a lint clone is a poor trade.
#   * Five pairs are Temporal test-harness bodies — stub activities and
#     concurrency gates whose activity names differ per stage.
#
# So `tests/` stays unformatted. The cost of widening is a refactor of the
# repo's most semantically load-bearing tests; the benefit is formatting
# consistency in files no image ships. Revisit only if those suites are being
# restructured for their own reasons.
#
# `scripts/` and `tools/` are dev utilities that are not shipped; including
# them would pull their own pre-existing lint debt into the gate.
#
# `_generated.py` is datamodel-codegen's output, compared byte-for-byte against
# a fresh regeneration by `test_generated_sdk_models_freshness` — formatting it
# fails that test the moment anyone regenerates.
force-exclude = "/(tests|scripts|tools)/|_generated\\.py"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.typecheck]
# Pylint can't introspect cv2's C-extension members; whitelist the
# whole namespace rather than listing each function.
generated-members = ["cv2.*"]
