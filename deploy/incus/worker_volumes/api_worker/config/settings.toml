# fishsense-api-workflow-worker — Incus interior settings.
#
# Non-secret config only. Secrets are rendered to WRITABLE runtime paths by the
# in-instance vault-agent from secret/tenants/fishsense/* (e.g. the temporal
# client cert trio under /run/tenant/temporal/) — NOT into this dir, which is a
# read-only store bind. The NRP kubeconfig is not delivered yet; see [kubernetes].
#
# DIFF vs the old orchestrator settings.toml: [temporal] now points at the
# shared krg-prod cluster instead of the in-stack `fishsense-temporal`.

[general]
max_workers = 8

# krg-prod shared Temporal (HANDOFF §6). mTLS-only; the gRPC TLS server-name is
# overridden to workflows.krg.ucsd.edu even though we dial krg-prod.ucsd.edu.
# The client cert/key/CA are rendered by the in-instance vault-agent to
# /run/tenant/temporal/ (wired by krg-infra #435; the trio is present on the
# slot). The CN switches to `fishsense-worker` once #435's grant is live.
[temporal]
host = "krg-prod.ucsd.edu"
port = "7233"
tls = true
# Tenant namespace on the shared krg-prod cluster (krg-infra terraform/temporal).
# OSS mTLS authenticates the client but does NOT pin it to a namespace (ADR 0023),
# so it must be requested explicitly — omitting it lands workflows in `default`.
namespace = "fishsense"
client_cert = "/run/tenant/temporal/tls.crt"
client_private_key = "/run/tenant/temporal/tls.key"
domain = "workflows.krg.ucsd.edu"           # TLS server-name override (SNI)
server_root_ca_cert = "/run/tenant/temporal/ca.crt"

[label_studio]
# Hosted Label Studio (HumanSignal) — the self-hosted labeler.e4e.ucsd.edu was retired.
url = "https://app.heartex.com"
# LS Enterprise workspace new per-dive projects are created in. Resolved to
# its numeric id at runtime via workspaces.list(). Empty = personal/default.
workspace = "FishSense"
# Label Studio user id of the service account (e4e+fishsense@ucsd.edu), stamped
# as `completed_by` on machine-written annotations populate IMPORTS.
#
# Not a secret — a user id is visible to any org member — so it lives here
# rather than in OpenBao, alongside `workspace`. `api_key` is the secret half
# and stays in the vault-agent render.
#
# Needed because Label Studio attributes an imported annotation to the PROJECT
# OWNER, not the API caller. `ls.annotations.create` takes the authenticated
# user and so was fixed by giving the worker the bot's token; the import path
# was not. On 2026-09-04 the worker had been the bot since 18:07 and populate
# still seeded 61 annotations at 18:17 — and 164 more at 19:17 — under the
# human who happened to own the project.
#
# 0 or absent = omit the field (old, wrong-attribution behaviour) rather than
# send `completed_by: null`, which LS rejects and which would fail populate for
# a whole dive.
bot_user_id = 215238

[e4e_nas]
url = "https://e4e-nas.ucsd.edu:6021"
# One serial .ORF download at a time — FileStation's download backend falls
# over under concurrent large transfers. Ramp up (2, 3) only while watching
# the NAS stay healthy.
stage_concurrency = 1

# Interior-network URL for SDK calls into fishsense-api — same compose network,
# bypasses our traefik + the API forwardAuth gate.
[fishsense_api]
url = "http://fishsense-api:8000"

# Hosted Garage (S3-compatible) object store on the NAS. S3 keys authenticate
# from any IP (open egress NAT reaches it). access_key/secret_key in .secrets.toml.
[object_store]
endpoint_url = "https://s3.e4e.ucsd.edu"
region = "garage"
# `bucket` = raw/slate scratch; `labels_bucket` = the LS-facing bucket where
# processed JPEGs live (under `labels_prefix`). krg-infra provisioned both.
bucket = "fishsense-lite"
labels_bucket = "labels-fishsense-lite"
labels_prefix = "fishsense-lite"

# NRP data-worker scale-to-zero. The api-worker scales the data-worker
# Deployment (ns `e4e-fishsense`) 0 <-> active_replicas on demand.
#
# `kubeconfig_path` points at a vault-agent SOFT render (secrets.nix →
# /run/tenant/nrp/kubeconfig, mounted into this worker by compose.yml) — the
# committed config dir is a read-only store bind, so the secret kubeconfig
# can't live here. config.py validates the path with a `path_validator` that
# runs eagerly at startup, so the file MUST exist: seed `nrp.kubeconfig` in
# OpenBao BEFORE this converges, or the worker crash-loops (isolated to this
# worker; the slot stays up because the render is soft). With `kubeconfig_path`
# absent the scaling activity no-ops (data-worker assumed always-on).
#
# `namespace` MUST match the NRP namespace + the kustomization pin in
# deploy/k8s/data-worker (e4e-fishsense) — it's where the scale patch is applied.
[kubernetes]
kubeconfig_path = "/run/tenant/nrp/kubeconfig"
namespace = "e4e-fishsense"
# The CPU worker. The GPU worker and its CPU-only fallback default off this
# name (`-gpu`, `-gpu-cpu-fallback`), so all three move together if it changes.
deployment_name = "fishsense-data-processing-workflow-worker"
# How many CPU worker pods to hold while a stage is active (clamped [1, 4]).
#
# As of the 2026-08-25 GPU split this no longer holds a GPU: the CPU Deployment
# requests none, and the GPU count is `gpu_active_replicas` below. The
# "Insufficient nvidia.com/gpu" scheduling problem described next therefore no
# longer applies to this setting — raising it is now an ordinary throughput
# decision, bounded only by NRP CPU/memory quota.
#
# This was 2, paired with dropping the data-worker's
# `general.max_concurrent_activities` 4 -> 2 after the 2026-07-21 OOM
# CrashLoopBackOff — per-pod peak memory halved, throughput recovered
# horizontally rather than by packing more concurrent full-res rawpy decodes
# into one pod. Going back to 1 gives up that horizontal half, so a large dive
# takes roughly twice as long; it does NOT reintroduce the OOM, which is
# governed by max_concurrent_activities and is unchanged.
#
# It also removed a live scheduling problem, which is the history that led to
# the split: at 2 the second pod sat Pending on `129 Insufficient
# nvidia.com/gpu` (2026-08-20), so a GPU was requested and queued for without
# being used. Every CPU stage was paying for a card it never touched.
#
# Raise back to 2-4 for a giant single dive, or for active-window resilience on
# a preemption-prone cluster. Never automatic.
active_replicas = 1
idle_cooldown_minutes = 15

# --- GPU worker + CPU fallback ------------------------------------------------
#
# `fishsense_data_processing_gpu_queue` carries one stage, `predict_laser_image`
# (the laser detector). It is served by two Deployments — `...-gpu`, which
# requests a card, and `...-gpu-cpu-fallback`, which does not and runs the same
# checkpoint on the CPU. Exactly one is scaled up at a time.
#
# After `gpu_max_start_failures` consecutive failed GPU starts the api-worker
# scales the GPU one to 0 and the fallback to `gpu_fallback_replicas` for
# `gpu_fallback_minutes`, then probes the GPU again. Slower predictions beat
# none, and the window expires so a transient NRP shortage can't strand us on
# CPU permanently. State is kept in annotations on the GPU Deployment
# (`kubectl describe deploy fishsense-data-processing-workflow-worker-gpu`);
# absent annotations mean nothing has gone wrong.
#
# One card. NRP is GPU-contended (see above) and the detector is fast; this is
# deliberately decoupled from `active_replicas` so scaling CPU throughput never
# silently asks for more GPUs.
gpu_active_replicas = 1
gpu_fallback_replicas = 1
# 10 minutes covers an NRP cold start (image pull is the slow part). Anything
# longer than this and the pod is not coming.
gpu_start_timeout_seconds = 600
gpu_max_start_failures = 3
gpu_fallback_minutes = 180
gpu_wedge_grace_minutes = 5
