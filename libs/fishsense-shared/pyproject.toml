[project]
name = "fishsense-shared"
version = "0.8.0"
description = "Shared Dynaconf, logging, and Temporal helpers for FishSense Lite services."
requires-python = ">=3.13"
dependencies = [
    "dynaconf>=3.2.11",
    "platformdirs>=4.3.8",
    "pydantic>=2.0",
    "temporalio>=1.15.0",
    "validators>=0.35.0",
]

# boto3 is an EXTRA, not a base dependency. `fishsense_shared.object_store`
# is imported only by the two workers that talk to Garage; fishsense-api and
# fishsense-backup-worker also depend on this package and must not inherit
# botocore's ~100MB into their runtime images. Both workers already declare
# boto3 directly, so nothing needs to opt in today — the extra exists so a
# future consumer can express the dependency honestly.
[project.optional-dependencies]
s3 = [
    "boto3>=1.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.2",
    # Needed to exercise `object_store` at the 100% coverage bar below.
    "boto3>=1.35.0",
    "moto[s3]>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Coverage is ratcheted at 100%. The point isn't the number — it's that
# anything genuinely not worth covering has to be *declared* here, so a real
# gap can't hide behind a comfortable-looking 94%. If a new line can't
# sensibly be tested, add it to `exclude_also` (or mark it `# pragma: no
# cover`) with a reason, rather than lowering the bar.
#
# `branch = true` because line coverage answers "did this run", and the bugs
# in this repo have been "did the *other* side of the if run" — the
# E4EFS_DOCKER footgun was on a line executed by every single test.
[tool.coverage.run]
branch = true
source = ["src/fishsense_shared"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [
    # Never executed at runtime; TYPE_CHECKING blocks exist for the checker.
    "if TYPE_CHECKING:",
    # Abstract methods have no body to exercise.
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"
