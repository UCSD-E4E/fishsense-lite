name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with PACKAGES in check.sh — that list is what a
        # developer runs locally as `./check.sh unit`, and what
        # integration.yml drives via `./check.sh integration`. This matrix
        # had drifted from it: fishsense-shared and fishsense-backup-worker
        # carried 50 passing tests that CI never executed, so a regression
        # in either would have reached main silently. fishsense-shared is
        # the worst place for that — every service depends on it.
        include:
          - package: libs/fishsense-api-sdk
            cov: fishsense_api_sdk
          - package: libs/fishsense-shared
            cov: fishsense_shared
          - package: services/fishsense-api
            cov: fishsense_api
          - package: services/fishsense-api-workflow-worker
            cov: fishsense_api_workflow_worker
          - package: services/fishsense-backup-worker
            cov: fishsense_backup_worker
          - package: services/fishsense-data-processing-workflow-worker
            cov: fishsense_data_processing_workflow_worker
    name: pytest (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup uv + sync (cached, retried)
        uses: ./.github/actions/setup-uv-sync
        with:
          args: --all-packages --all-groups
      - name: Run pytest with coverage
        run: |
          uv run --directory ${{ matrix.package }} pytest -v \
            --cov=${{ matrix.cov }} \
            --cov-report=term-missing \
            --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.cov }}
          name: ${{ matrix.cov }}
          fail_ci_if_error: false

  # Runtime import smoke test: catches dev/runtime dependency drift.
  #
  # The runtime Dockerfile installs each service with
  #   uv sync --frozen --no-dev --no-editable --package <name>
  # so any module that imports something declared only in
  # `[dependency-groups.dev]` will crash at container startup time
  # rather than at build time. This job mirrors that install in CI
  # and tries to import the package's entry-point module, so the
  # crash surfaces here instead of in prod after auto-deploy.
  #
  # Concrete bug this would have caught: fishsense-api v1.27.0 (PR
  # #103) added `from alembic import command` at module-load time but
  # left alembic in `[dependency-groups.dev]`. Runtime image had no
  # alembic; the deployed container crash-looped on `import
  # fishsense_api`. Hotfixed in PR #107 + this job.
  #
  # If this job ever fails: a runtime module is now importing
  # something only declared as a dev dep. Either add the package to
  # `[project.dependencies]` (if it's truly runtime — common case) or
  # move the import to a dev-only code path (if it's dev-only — e.g.,
  # tooling).
  runtime-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `import fishsense_api` already chains through controllers
          # and server.app via __init__.py; that's the same module
          # graph uvicorn loads at startup.
          - package: fishsense-api
            module: fishsense_api
          # The three workers' __init__.py files only set __version__;
          # importing the .worker submodule exercises the activities
          # and runtime-dep-using code paths the entry-point script
          # would.
          - package: fishsense-api-workflow-worker
            module: fishsense_api_workflow_worker.worker
            # `k8s_scaling.apps_v1_api` imports the kubernetes client inside
            # the function, so a deployment with no `[kubernetes]` config
            # never pays for it -- and so `import ...worker` never reaches
            # it. Same blind spot as sam3, and a worse blast radius: a
            # dep-group slip there ships green and then kills every
            # data-worker scale-up and the idle sweeper at first invocation,
            # which is how NRP GPUs end up held around the clock.
            lazy_modules: kubernetes
          - package: fishsense-backup-worker
            module: fishsense_backup_worker.worker
          - package: fishsense-data-processing-workflow-worker
            module: fishsense_data_processing_workflow_worker.worker
            # opencv-python needs libgl1 + libglib2.0-0 to import cv2,
            # mirroring this service's Dockerfile system-libs install.
            apt: libgl1 libglib2.0-0
            # The heavy third-party modules the activities reach. Several
            # are imported *lazily*, inside the function that needs them, so
            # the cpu-role worker never pays for torch -- and those the
            # entry-point import above cannot see. That is how a missing
            # runtime dep got to prod: sam3's `model_builder` imports
            # `pkg_resources` at module scope, the image had no setuptools,
            # and every predict activity died on its first frame while this
            # job stayed green.
            #
            # Six of the eleven are new coverage: `torch`, both `sam3`
            # entries, `fishsense_core.fish`, `.slate` and
            # `.image.linear_raw_image`. The other five are already reached
            # today, because `worker` imports `roles`, which eagerly imports
            # 15 activity modules. Four of those five -- `cv2`,
            # `fishsense_core.laser`, `.image.raw_image` and
            # `.image.rectified_image` -- are module-scope imports in the
            # activity modules themselves. `.world_point` is one level
            # deeper: no activity module imports it directly, it arrives via
            # `laser_geometry.py` and `calibration_geometry.py`, which they
            # do import at module scope.
            #
            # They are listed anyway, deliberately. That reachability is a
            # property of where an import happens to sit right now: moving
            # one into a function -- the same optimisation that hid sam3 --
            # would silently drop it from this job with nothing to say so.
            # Listing them makes the coverage explicit rather than
            # incidental, and `fishsense_core` is not hypothetical here: it
            # went 3.0.0 -> 4.0.0 in #760.
            #
            # Keep in step with the imports under `src/**/activities/`;
            # grepping that tree for `from fishsense_core` / `from sam3` /
            # `import torch` is how this list was derived. There is no
            # tripwire, so it can rot.
            lazy_modules: >-
              cv2
              torch
              sam3.model_builder
              sam3.model.sam3_image_processor
              fishsense_core.fish
              fishsense_core.laser
              fishsense_core.slate
              fishsense_core.world_point
              fishsense_core.image.raw_image
              fishsense_core.image.rectified_image
              fishsense_core.image.linear_raw_image
    name: runtime import (${{ matrix.package }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system libs (mirror Dockerfile)
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}
      # Sync the runtime-only env (mirrors the Dockerfile). The
      # `--frozen --no-dev --no-editable --package <name>` args match
      # the install line in services/<name>/Dockerfile exactly, so a
      # runtime/dev dep drift surfaces with the same import error the
      # container would crash on at startup.
      - name: Setup uv + sync (cached, retried)
        uses: ./.github/actions/setup-uv-sync
        with:
          args: --frozen --no-dev --no-editable --package ${{ matrix.package }}
      - name: Import entry-point module
        # If a runtime module imports something declared only in
        # `[dependency-groups.dev]`, this exits non-zero with
        # `ModuleNotFoundError`. Same crash mode as the deployed
        # container.
        run: .venv/bin/python -c "import ${{ matrix.module }}"
      - name: Import lazily-imported runtime modules
        # Same runtime-only env; these are reached at activity runtime rather
        # than at import, so the entry-point import above cannot cover them.
        if: matrix.lazy_modules != ''
        run: |
          for m in ${{ matrix.lazy_modules }}; do
            echo "importing $m"
            .venv/bin/python -c "import $m"
          done

  # Node test suite for apps/fishsense-lite-web. CLAUDE.md mandates TDD project-wide;
  # without this job, broken tests in apps/fishsense-lite-web/lib could land on main.
  vitest:
    runs-on: ubuntu-latest
    name: vitest (apps/fishsense-lite-web)
    defaults:
      run:
        working-directory: apps/fishsense-lite-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/fishsense-lite-web/package-lock.json
      - name: Install deps
        # `npm ci` requires a lockfile; fall back to `npm install` until
        # one is checked in (first run will commit one via the next push).
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run vitest
        run: npm test
