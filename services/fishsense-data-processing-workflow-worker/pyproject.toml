[project]
name = "fishsense-data-processing-workflow-worker"
version = "3.4.1"
description = "Add your description here"
readme = "README.md"
# Pinned to cp313 only: the [laser-detector] extra pulls torch, which has no
# cp314 wheels yet, and the runtime image is python:3.13-slim regardless. Widen
# again once torch (and the fishsense-core wheel) both ship for a new series.
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.35.0",
    "dynaconf>=3.2.11",
    "fishsense-api-sdk>=2.3.0",
    "fishsense-core[laser-detector,slate]",
    # SAM3 (head/tail predict). Installed from git because Meta publishes no
    # wheel; pinned to a commit rather than a branch so the stage's behaviour
    # cannot change under `HEADTAIL_PREDICTOR_VERSION` without a visible diff.
    # The weights are NOT vendored here — they are fetched from Garage and
    # cached on a volume (see `checkpoint_cache`), which keeps a gated,
    # multi-gigabyte download out of a pullable image.
    "sam3 @ git+https://github.com/facebookresearch/sam3.git@8e451d5eb43c817b64ae7577fb7b9ae223db88a9",
    # sam3's `model_builder` does a module-level `import pkg_resources`, and
    # calls `resource_filename("sam3", "assets/bpe_simple_vocab_16e6.txt.gz")`
    # to find the BPE vocab inside its own wheel. sam3 does not declare
    # setuptools, and Python 3.12+ no longer seeds it into a venv, so the
    # `uv sync --no-dev` runtime image had no `pkg_resources` and every
    # predict activity died on its first frame in prod (2026-09-07).
    #
    # The upper bound is the load-bearing half. setuptools **removed**
    # `pkg_resources` in 82.0.0 -- not merely deprecated it -- so every
    # release from 82.0.0 on fails exactly as if setuptools were absent, and
    # an unbounded pin resolves to one of them. Measured rather than read
    # off a changelog: a clean venv per version shows 80.9.0 / 80.10.2 /
    # 81.0.0 shipping `pkg_resources`, and 82.0.0 / 82.0.1 / 83.0.0 / 84.0.0
    # not. Stated as the boundary rather than as whatever is newest today,
    # which moves.
    #
    # `uv run --with setuptools==X python -c "import pkg_resources"` cannot
    # answer this and will tell you every version is fine -- it layers the
    # pinned version on a base interpreter that already has `pkg_resources`.
    # Install into an empty venv and look for the directory.
    #
    # `<82` rather than the `<81` upstream's own deprecation text suggests,
    # because 81.0.0 measurably still ships it and a bound should state what
    # is actually required. Revisit when sam3 stops importing
    # `pkg_resources`; this is a ceiling on a dependency we do not otherwise
    # use, so it should not outlive that.
    "setuptools>=80.9.0,<82",
    # Three more that sam3's import chain reaches but its `[project]` block
    # never declares -- it lists only timm/numpy/tqdm/ftfy/regex/iopath/
    # typing_extensions/huggingface_hub. `pycocotools` is the surprising one:
    # `model_builder` pulls in `sam3.train.data.coco_json_loaders`, training
    # code that upstream lists only under its `dev`/`notebooks` extras, so an
    # inference-only install cannot see it. Found by walking the chain in a
    # `--no-dev` env one ModuleNotFoundError at a time; the runtime-import CI
    # job now walks the same chain so the next gap cannot reach prod.
    "einops>=0.8.0",
    "psutil>=6.0.0",
    "pycocotools>=2.0.8",
    "fishsense-shared",
    "httpx>=0.28.1",
    "label-studio-sdk>=2.0.7",
    "numpy>=2.2.6",
    "opencv-contrib-python>=4.12.0.88",
    "opencv-python>=4.12.0.88",
    "pandas>=2.3.3",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.9",
    "pymupdf>=1.26.6",
    "rawpy>=0.25.1",
    "scikit-image>=0.25.2",
    "scikit-learn",
    "sqlmodel>=0.0.25",
    "synology-api>=0.8.1",
    "temporalio>=1.17.0",
    "tqdm>=4.67.1",
    "validators>=0.35.0",
]

[project.scripts]
fishsense_data_processing_workflow_worker = "fishsense_data_processing_workflow_worker.worker:run"

[tool.semantic_release]
version_variables = ["src/fishsense_data_processing_workflow_worker/__init__.py:__version__"]
version_toml = [
    "pyproject.toml:project.version",
]
assets = []
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
logging_use_named_masks = false
major_on_zero = true
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "(main)"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.changelog]
template_dir = "templates"
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = []

[tool.semantic_release.changelog.environment]
block_start_string = "{%"
block_end_string = "%}"
variable_start_string = "{{"
variable_end_string = "}}"
comment_start_string = "{#"
comment_end_string = "#}"
trim_blocks = false
lstrip_blocks = false
newline_sequence = "\n"
keep_trailing_newline = false
extensions = []
autoescape = true

[tool.semantic_release.commit_author]
env = "GIT_COMMIT_AUTHOR"
default = "semantic-release <semantic-release>"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
name = "origin"
type = "github"
ignore_token_for_push = false

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.uv.sources]
fishsense-api-sdk = { workspace = true }
fishsense-core = [
    { url = "https://github.com/UCSD-E4E/fishsense-core/releases/download/fishsense-core-v4.0.0/fishsense_core-4.0.0-cp313-cp313-manylinux_2_34_x86_64.whl", marker = "python_version == '3.13'" },
]
fishsense-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.12,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "matplotlib>=3.10.6",
    "moto[s3]>=5.0.0",
    "pylint>=3.3.8",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.2",
]
hack = [
    "asyncpg>=0.30.0",
    "label-studio-sdk>=2.0.7",
    "matplotlib>=3.10.6",
    "opencv-contrib-python>=4.12.0.88",
    "opencv-python>=4.12.0.88",
    "rawpy>=0.25.1",
    "scikit-image>=0.25.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need the devcontainer stack (postgres, temporal, nginx).
# CI runs the default selection only; from inside the devcontainer run
# `pytest -m integration` to exercise them against the live services.
markers = [
    "integration: requires the local devcontainer stack",
]
addopts = "-m 'not integration'"
